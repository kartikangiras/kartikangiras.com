<style>
@font-face { font-family: "et-book"; font-weight: 400; font-style: normal; font-display: swap;
  src: url("https://cdn.jsdelivr.net/gh/edwardtufte/tufte-css@gh-pages/et-book/et-book-roman-line-figures/et-book-roman-line-figures.woff") format("woff"); }

:root {
  --background: #fafaf8; --foreground: #111111; --muted: #6b7280; --card: #f4f4f2; --border: #e5e5e3;
  --font: "et-book", "Crimson Pro", Palatino, "Palatino Linotype", Georgia, serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
a:focus-visible { outline: 2px solid var(--foreground); outline-offset: 3px; border-radius: 3px; }
.page { max-width: 672px; margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: 56px 0; }
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); transition: color .15s; }
.back:hover { color: var(--foreground); }
.back svg { width: 12px; height: 12px; }
h1 { margin: 32px 0 0; font-size: 30px; line-height: 1.2; font-weight: 600; letter-spacing: -0.025em; }
.lede { margin: 12px 0 0; font-size: 16px; line-height: 1.625; color: var(--muted); }
.label { margin: 48px 0 16px; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.rows { border-top: 1px solid var(--border); }
.row { display: flex; align-items: baseline; gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--border); }
.row .name { flex: 1; min-width: 0; font-size: 14px; }
a.row:hover .name { text-decoration: underline; text-underline-offset: 2px; }
.row .meta { flex-shrink: 0; font-size: 12px; color: var(--muted); }
.row .meta.mono { font-family: var(--mono); }
.row svg { flex-shrink: 0; width: 14px; height: 14px; color: var(--border); transition: color .15s; align-self: center; }
a.row:hover svg { color: var(--foreground); }
footer { margin-top: 64px; padding-block: 40px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
footer p { margin: 0; }
.post { display: flex; align-items: baseline; gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--border); }
.post > div { flex: 1; min-width: 0; }
.post .name { display: block; font-size: 14px; font-weight: 600; line-height: 1.375; text-wrap: balance; }
.post:hover .name { text-decoration: underline; text-underline-offset: 2px; }
.post .venue { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.post .sum { display: block; margin-top: 6px; font-size: 14px; line-height: 1.625; }
.post .meta { flex-shrink: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.post svg { flex-shrink: 0; width: 14px; height: 14px; color: var(--border); transition: color .15s; align-self: center; }
.post:hover svg { color: var(--foreground); }
.empty { margin: 0; padding-block: 40px; text-align: center; font-size: 14px; color: var(--muted); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<body>
<main class="page">
  <a class="back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>back</a>
  <h1>Essays</h1>
  <p class="lede">Short personal essays on things I'm thinking about.</p>
  <div class="rows" id="posts" style="margin-top: 40px"></div>
  <footer><p>built by Kartik Angiras, 2026</p></footer>
</main>
<script>
// Add essays here. For one hosted on this site, set href to its page, e.g. "writing/my-essay.html".
const POSTS = [];
const ARROW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;
const box = document.getElementById("posts");
if (!POSTS.length) { box.style.borderTop = "0"; box.innerHTML = '<p class="empty">Essays coming soon.</p>'; }
POSTS.forEach(p => {
  const a = document.createElement("a");
  a.className = "post"; a.href = p.href;
  if (/^https?:/.test(p.href)) { a.target = "_blank"; a.rel = "noopener"; }
  a.innerHTML = `<div><span class="name">${p.title}</span><span class="venue">${p.venue}</span>${p.summary ? `<span class="sum">${p.summary}</span>` : ""}</div><span class="meta">${p.date}</span>${ARROW}`;
  box.appendChild(a);
});
</script>
</body>
