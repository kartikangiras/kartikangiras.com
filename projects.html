<main class="page">

  <h1>Projects</h1>
  <p class="lede">Things I've built, mostly around AI safety and applied machine learning.</p>
  <div class="grid" id="projects-grid"></div>
  <footer><p>built by Kartik Angiras, 2026</p></footer>
</main>
<script>
// Your projects. Add an `img` field (path to a screenshot, e.g. "projects/devries.png") to replace the drawn placeholder.
const PROJECTS = [
  { title: "Sindarin: Finance Agents That Can't Touch the Money", date: "Nov 2026", cat: "Applied AI",
    href: "https://sindarin-nu.vercel.app/",
    img: "projects/sindarin.jpg",
    desc: "AI agents draft a finance team's plans, payment runs and closing entries in chat. Model-free executors check who approved, from which room, and whether the ledger changed before anything moves." },
  { title: "DeVries: Injection Path Audits for AI Agents", date: "Oct 2026", cat: "AI Safety",
    href: "https://devries-falkor.vercel.app/",
    img: "projects/devries.jpg",
    desc: "Models a multi-agent system as a graph and finds every path where untrusted text can reach a high-impact action, then finds the smallest fix and verifies it on a sandboxed copy before a human approves it." },
  { title: "Mordor: Stubble-Smoke Forecasting", date: "Oct 2026", cat: "Environmental Forecasting",
    href: "https://d3mp6hbfwg9kx1.cloudfront.net/",
    img: "projects/mordor.jpg",
    desc: "A 5 km, 48-hour PM2.5 forecast of crop-fire smoke, turned into action cards for schools and hospitals. Beat the CAMS baseline on hourly error across 97 stations in a hindcast." },
  { title: "Tripwire: Provenance Monitor for Agent Swarms", date: "Oct 2026", cat: "AI Safety",
    href: "https://github.com/kartikangiras/tripwire",
    img: "projects/tripwire.jpg",
    desc: "Flags claims that lose their context as they spread between agents. On a 194K-record log from 46 agents, it caught a wrong figure that circulated for 12 days and was later certified by an agent." },
];
function drawThumb(canvas, item) {
  const dpr = window.devicePixelRatio || 1, w = 320, h = 200;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr, dpr);
  let seed = [...item.title].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  ctx.fillStyle = "#f4f4f2"; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "#9a9a96"; ctx.fillStyle = "#ffffff"; ctx.lineWidth = 1.2;
  const cols = 3 + Math.floor(rnd() * 3), nodes = [];
  for (let c = 0; c < cols; c++) {
    const n = 2 + Math.floor(rnd() * 3), x = 40 + c * ((w - 80) / (cols - 1));
    nodes.push([...Array(n)].map((_, i) => [x, (h / (n + 1)) * (i + 1)]));
  }
  for (let c = 0; c < cols - 1; c++)
    nodes[c].forEach(a => nodes[c + 1].forEach(b => { if (rnd() > .3) { ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke(); } }));
  nodes.flat().forEach(([x, y]) => { ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); });
}

function renderCards(items, gridId) {
  const grid = document.getElementById(gridId);
  items.forEach(w => {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <a class="thumb" href="${w.href}" target="_blank" rel="noopener" aria-label="${w.title}">
        ${w.img ? `<img src="${w.img}" alt="${w.title}">` : `<canvas aria-hidden="true"></canvas>`}
      </a>
      <h3><a href="${w.href}" target="_blank" rel="noopener">${w.title}</a></h3>
      <p class="date">${w.date}, ${w.cat}</p>
      <p class="desc">${w.desc}</p>`;
    grid.appendChild(card);
    const cv = card.querySelector("canvas");
    if (cv) drawThumb(cv, w);
  });
}
renderCards(PROJECTS, "projects-grid");
</script>
