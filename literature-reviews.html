:root {
  --background: #fafaf8; --foreground: #111111; --muted: #6b7280; --card: #f4f4f2; --border: #e5e5e3;

  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--background); color: var(--foreground); font-family: var(--font);
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

a:focus-visible { outline: 2px solid var(--foreground); outline-offset: 3px; border-radius: 3px; }

<body>
<main class="page">
  <a class="back" href="reads.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Reads</a>
  <h1>Literature Reviews</h1>
  <p class="lede">Papers I've read across distributed systems, applied ML and AI safety, with notes on each.</p>
  <p class="label">Table of contents</p>
  <div class="rows" id="topics"></div>
  <footer><p>built by Kartik Angiras, 2026</p></footer>
</main>
<script>
// Add papers to a topic: { title: "Paper name", authors: "Author et al.", year: 2024, href: "link to paper or your notes" }
const TOPICS = [
  { name: "Distributed Systems", papers: [] },
  { name: "Machine Learning", href: "literature-reviews/machine-learning.html", papers: [
    { title: "On the Theoretical Limitations of Embedding-Based Retrieval", authors: "Weller et al.", year: 2025 },
    { title: "Attention Is All You Need", authors: "Vaswani et al.", year: 2017 } ] },
  { name: "AI Safety", papers: [] },
];
const ARROW = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`;
const box = document.getElementById("topics");
TOPICS.forEach(t => {
  const n = t.papers.length;
  const el = document.createElement(n ? "a" : "div");
  el.className = "row";
  if (n) el.href = t.href;
  el.innerHTML = `<span class="name">${t.name}</span><span class="meta mono">${n} paper${n === 1 ? "" : "s"}</span>${ARROW}`;
  box.appendChild(el);
});
</script>
